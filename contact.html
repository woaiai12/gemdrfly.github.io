<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系我 · Gemdrfly</title>
    <meta name="description" content="联系 Gemdrfly：系统运维与 IT 技术服务，接单范围、联系方式。">
    <link rel="stylesheet" href="styles.css">
    <style>
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        .contact-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 28px;
            text-align: center;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }
        .contact-card:hover {
            transform: translateY(-4px);
            border-color: rgba(148, 163, 184, 0.4);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        }
        .contact-card .icon {
            font-size: 40px;
            margin-bottom: 14px;
        }
        .contact-card h3 {
            color: var(--primary);
            font-size: 20px;
            margin-bottom: 8px;
        }
        .contact-card p {
            color: var(--text-2);
            font-size: 15px;
            margin-bottom: 12px;
        }
        .contact-card a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
        }
        .contact-card a:hover {
            color: var(--primary-2);
        }
        .placeholder {
            color: #eab308 !important;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <nav class="nav">
        <a href="index.html" class="logo">Gemdrfly</a>
        <div class="links">
            <a href="index.html">首页</a>
            <a href="services.html">服务</a>
            <a href="cases.html">案例</a>
            <a href="blog.html">文章</a>
            <a href="contact.html" class="active">联系</a>
        </div>
    </nav>

    <main class="container">
        <h1>联系我</h1>
        <p class="subtitle" style="color:#94a3b8; font-size:19px; margin-top:-8px; margin-bottom:40px;">先聊需求，免费。合适就做，不合适给你指路。</p>

        <div class="contact-grid">
            <div class="contact-card">
                <div class="icon">💬</div>
                <h3>微信</h3>
                <p>最常用的方式，回复快。</p>
                <a href="#" class="placeholder">【微信号：待填】</a>
            </div>
            <div class="contact-card">
                <div class="icon">📧</div>
                <h3>邮箱</h3>
                <p>发需求文档、附件用。</p>
                <a href="#" class="placeholder">【邮箱：待填】</a>
            </div>
            <div class="contact-card">
                <div class="icon">🐙</div>
                <h3>GitHub</h3>
                <p>代码和开源项目。</p>
                <a href="https://github.com/woaiai12" target="_blank">github.com/woaiai12</a>
            </div>
        </div>

        <div class="cta" style="text-align:left;">
            <h2 style="text-align:center;">发个需求</h2>
            <p style="text-align:center;">填一下，我会尽快回复。或者直接加微信更快。</p>
            <form id="contact-form">
                <div class="form-group">
                    <label for="name">怎么称呼你</label>
                    <input type="text" id="name" name="name" placeholder="你的称呼">
                </div>
                <div class="form-group">
                    <label for="contact">联系方式（微信 / 手机 / 邮箱）</label>
                    <input type="text" id="contact" name="contact" placeholder="方便我联系你的方式">
                </div>
                <div class="form-group">
                    <label for="need">你想解决什么问题</label>
                    <textarea id="need" name="need" placeholder="比如：想给店铺做个官网 / 有个重复的报表想自动化 / 服务器老出问题…"></textarea>
                </div>
                <div class="btn-group" style="justify-content:flex-start;">
                    <button type="submit" class="btn btn-primary">提交</button>
                </div>
                <p id="form-tip" style="color:#22c55e; margin-top:16px; display:none;">已收到（演示）——正式上线后这里会接到你的微信/邮箱。</p>
            </form>
        </div>

        <div class="footer">
            <p>© 2026 Gemdrfly · 把人生当系统来维护</p>
            <p><a href="index.html">首页</a> · <a href="services.html">服务</a> · <a href="cases.html">案例</a> · <a href="contact.html">联系</a></p>
        </div>
    </main>

    <script>
        // 静态站无后端：提交仅做提示。正式版可换成表单服务（如 Formspree）或直接跳转微信。
        document.getElementById('contact-form').addEventListener('submit', function (e) {
            e.preventDefault();
            document.getElementById('form-tip').style.display = 'block';
            this.reset();
        });
    </script>
</body>
</html>
